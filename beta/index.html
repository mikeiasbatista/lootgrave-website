<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lootgrave Beta</title>
  <style>
    :root {
      color-scheme: dark;
      font: 16px system-ui, sans-serif;
      background: #0b0a09;
      color: #f4e7d0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(100vw, calc((100vh - 44px) * 16 / 9));
      width: min(100vw, calc((100dvh - 44px) * 16 / 9));
    }

    #screen {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #140f0c;
    }

    #screen:fullscreen {
      display: grid;
      place-items: center;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #screen:fullscreen canvas {
      width: min(100vw, calc(100vh * 16 / 9));
      height: auto;
      aspect-ratio: 16 / 9;
    }

    #loading {
      --progress-track: linear-gradient(#100d14, #211720);
      --progress-fill: linear-gradient(180deg, #f0be70 0%, #bb6b45 23%, #912b39 65%, #5a2029 100%);
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-content: center;
      justify-items: center;
      gap: clamp(6px, 1.3vw, 16px);
      padding: 8px;
      text-align: center;
      background: radial-gradient(ellipse at 50% 44%, #301a29, #17101f 53%, #0c090e 88%);
    }

    #loading[hidden], #loading [hidden] { display: none; }

    #loading-coin { width: min(24%, 8.5rem); }
    #loading-coin img { display: block; width: 100%; height: auto; }

    #status {
      max-width: 90%;
      color: #f0debe;
      font: bold clamp(.75rem, 1.8vw, 1rem) Georgia, serif;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-shadow: 0 2px 3px #0c090e;
    }

    #progress-frame {
      box-sizing: border-box;
      width: min(68%, 22rem);
      padding: 3px 4px;
      background: linear-gradient(#b09573, #665047 43%, #3e2a25 58%, #785640);
      clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 9px 100%, 0 50%);
    }

    #progress {
      appearance: none;
      display: block;
      width: 100%;
      height: clamp(8px, 1.3vw, 12px);
      border: 0;
      background: var(--progress-track);
      clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 50%, calc(100% - 6px) 100%, 6px 100%, 0 50%);
    }

    #progress::-webkit-progress-bar { background: var(--progress-track); }
    #progress::-webkit-progress-value { background: var(--progress-fill); }
    #progress::-moz-progress-bar { background: var(--progress-fill); }

    footer { display: flex; justify-content: flex-end; height: 44px; align-items: center; }

    button {
      margin-right: 6px;
      padding: 5px 12px;
      border: 1px solid #63482d;
      border-radius: 4px;
      color: inherit;
      background: #241911;
      font: inherit;
      cursor: pointer;
    }
  </style>
  <script src="Build/asset-parts-6f0016084e0ea10e.js"></script>
</head>
<body>
  <main>
    <div id="screen">
      <canvas id="unity-canvas" width="1920" height="1080" tabindex="0" aria-label="Lootgrave game"></canvas>
      <div id="loading">
        <picture id="loading-coin">
          <source media="(prefers-reduced-motion: reduce)" srcset="loading-coin.png">
          <img src="loading-coin.gif" width="192" height="192" alt="">
        </picture>
        <span id="status" role="status">Loading Lootgrave…</span>
        <div id="progress-frame">
          <progress id="progress" max="1" value="0" aria-label="Game loading progress"></progress>
        </div>
      </div>
    </div>
    <footer><button id="fullscreen" type="button" hidden>Fullscreen</button></footer>
  </main>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.querySelector("#loading");
    const loadingCoin = document.querySelector("#loading-coin");
    const status = document.querySelector("#status");
    const progressFrame = document.querySelector("#progress-frame");
    const progress = document.querySelector("#progress");
    const fullscreen = document.querySelector("#fullscreen");
    const showError = (error) => {
      console.error(error);
      status.textContent = "Lootgrave could not start. Reload to try again.";
      loadingCoin.hidden = true;
      progressFrame.hidden = true;
      loading.hidden = false;
    };

    const config = {
      arguments: [],
      dataUrl: "Build/f8a43f950457ae423388c25dd8639fe3.data.unityweb",
      frameworkUrl: "Build/f3f02c48c41b3608fedca2bb3475fbf8.framework.js.unityweb",
      codeUrl: "Build/f877f93045414f2f187f9e1a7e24c75e.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      fullscreenElementID: "screen",
      companyName: "Lootgrave",
      productName: "Lootgrave ART023",
      productVersion: "0.1.0",
      autoSyncPersistentDataPath: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
    };

    const loader = document.createElement("script");
    loader.src = "Build/bdf8b01a9ce05c3b078b7a42fdd4cad5.loader.js";
    loader.onerror = showError;
    loader.onload = async () => {
      try {
        const game = await createUnityInstance(canvas, config, (value) => { progress.value = value; });
        loading.hidden = true;
        fullscreen.hidden = !document.fullscreenEnabled;
        fullscreen.addEventListener("click", () => {
          canvas.focus();
          game.SetFullscreen(1);
        });
      } catch (error) {
        showError(error);
      }
    };
    document.body.append(loader);
  </script>
</body>
</html>
